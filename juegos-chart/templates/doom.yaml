apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.doom.name }}-deployment
  labels:
    app: {{ .Values.doom.name }}
spec:
  replicas: {{ .Values.doom.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.doom.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.doom.name }}
    spec:
      containers:
      - name: {{ .Values.doom.name }}
        image: "{{ .Values.doom.image.repository }}:{{ .Values.doom.image.tag }}"
        imagePullPolicy: {{ .Values.doom.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.doom.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.doom.name }}-service
  labels:
    app: {{ .Values.doom.name }}
spec:
  type: {{ .Values.doom.service.type }}
  selector:
    app: {{ .Values.doom.name }}
  ports:
  - port: {{ .Values.doom.service.port }}
    targetPort: {{ .Values.doom.service.targetPort }}
    nodePort: {{ .Values.doom.service.nodePort }}
